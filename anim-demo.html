<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成語動畫卡試播 — 守株待兔</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#1a2332; font-family:"Microsoft JhengHei","PingFang TC",sans-serif; color:#fff;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:12px; }
  h1 { font-size:1.1rem; margin:8px 0 4px; color:#ffd97a; font-weight:600; }
  .hint { font-size:.8rem; color:#8fa3bf; margin-bottom:10px; }
  #stage-wrap { width:100%; max-width:720px; position:relative; border-radius:16px; overflow:hidden;
                box-shadow:0 8px 30px rgba(0,0,0,.45); background:#87ceeb; }
  svg { display:block; width:100%; height:auto; }
  #subtitle { position:absolute; left:0; right:0; bottom:0; padding:10px 16px 12px;
              background:linear-gradient(transparent, rgba(0,0,0,.72) 30%);
              font-size:clamp(.95rem,3.4vw,1.25rem); line-height:1.5; text-align:center;
              text-shadow:0 1px 3px #000; min-height:3.2em; display:flex; align-items:flex-end; justify-content:center; }
  #bigplay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             background:rgba(10,18,30,.55); cursor:pointer; z-index:5; }
  #bigplay .btn { width:84px; height:84px; border-radius:50%; background:#ffd97a; display:flex; align-items:center;
                  justify-content:center; font-size:2.2rem; color:#4a3200; box-shadow:0 4px 18px rgba(0,0,0,.4);
                  animation:pulse 1.6s infinite; }
  #bigplay p { margin-top:14px; font-size:1rem; color:#ffe9b3; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  #controls { display:flex; gap:10px; margin-top:12px; }
  #controls button { border:none; border-radius:20px; padding:9px 20px; font-size:.95rem; cursor:pointer;
                     background:#2c3f5e; color:#cfe0f5; }
  #controls button.primary { background:#ffd97a; color:#4a3200; font-weight:700; }

  /* ---------- 通用動畫 ---------- */
  .scene { opacity:0; pointer-events:none; transition:opacity .5s; }
  .scene.active { opacity:1; }

  /* S1 農夫耕作 */
  .active #farmer1 { animation:walkIn 2.2s ease-out forwards; }
  @keyframes walkIn { from{transform:translateX(-180px)} to{transform:translateX(0)} }
  .active #farmer1 .bob { animation:hoeSwing 1.1s 2.2s ease-in-out infinite; transform-origin:60px 40px; }
  @keyframes hoeSwing { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-24deg)} }
  .wheat { transform-origin:bottom center; animation:sway 2.4s ease-in-out infinite; }
  @keyframes sway { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }

  /* S2 兔子撞樁 */
  .active #rabbit2 { animation:dash 1.6s .4s cubic-bezier(.3,0,.7,1) forwards; }
  @keyframes dash { 0%{transform:translateX(330px)} 70%{transform:translateX(8px)} 78%{transform:translateX(-6px)}
                    100%{transform:translateX(0) rotate(0)} }
  .active #rabbit2 .body-g { animation:faint .7s 2s ease-in forwards; transform-origin:30px 55px; }
  @keyframes faint { to{transform:rotate(84deg) translateY(6px)} }
  .active #bang { animation:bangPop .5s 1.9s ease-out forwards; transform-origin:center; opacity:0; }
  @keyframes bangPop { 0%{opacity:0; transform:scale(.2)} 60%{opacity:1; transform:scale(1.25)} 100%{opacity:1; transform:scale(1)} }
  .active .dizzy { animation:spin 1.2s 2.4s linear infinite; transform-origin:center; opacity:0; animation-fill-mode:forwards; }
  @keyframes spin { 0%{opacity:1; transform:rotate(0)} 100%{opacity:1; transform:rotate(360deg)} }

  /* S3 農夫撿兔 */
  .active #farmer3 { animation:runOver 1.4s ease-out forwards; }
  @keyframes runOver { from{transform:translateX(-200px)} to{transform:translateX(0)} }
  .active #farmer3 .jump { animation:joyJump .7s 1.6s ease-in-out 3; transform-origin:bottom center; }
  @keyframes joyJump { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-26px)} }
  .active .spark { animation:sparkle 1s 1.8s ease-in-out infinite; opacity:0; }
  @keyframes sparkle { 0%,100%{opacity:0; transform:scale(.5)} 50%{opacity:1; transform:scale(1.2)} }

  /* S4 呆等日夜 */
  .active #sunmoon { animation:cycle 3.4s .6s linear 2 forwards; transform-origin:400px 470px; }
  @keyframes cycle { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  .active #sky4rect { animation:daynight 3.4s .6s linear 2 forwards; }
  @keyframes daynight { 0%,20%{fill:#87ceeb} 40%,70%{fill:#1d2a4a} 90%,100%{fill:#87ceeb} }
  .active .weed { transform-origin:bottom center; animation:grow 2.6s 2.4s ease-out forwards; transform:scaleY(0); }
  @keyframes grow { to{transform:scaleY(1)} }
  .active #farmer4 .slump { animation:slump 3s 3s ease-in-out forwards; transform-origin:center bottom; }
  @keyframes slump { to{transform:rotate(9deg) translateY(5px)} }
  .active #zzz { animation:zfloat 1.8s 4.5s ease-in-out infinite; opacity:0; }
  @keyframes zfloat { 0%{opacity:0; transform:translateY(0)} 40%{opacity:1} 100%{opacity:0; transform:translateY(-22px)} }

  /* S5 結尾字卡 */
  .active .zi { opacity:0; animation:ziPop .55s ease-out forwards; transform-origin:center; }
  .active .zi:nth-of-type(1){animation-delay:.15s} .active .zi:nth-of-type(2){animation-delay:.5s}
  .active .zi:nth-of-type(3){animation-delay:.85s} .active .zi:nth-of-type(4){animation-delay:1.2s}
  @keyframes ziPop { 0%{opacity:0; transform:scale(2.4) rotate(-8deg)} 70%{opacity:1; transform:scale(.94)}
                     100%{opacity:1; transform:scale(1)} }
  .active #meaning5 { opacity:0; animation:fadeUp .8s 1.9s ease-out forwards; }
  @keyframes fadeUp { from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:translateY(0)} }
</style>
</head>

<script>
(function () {
  var scenes = [
    { id: "s1", dur: 5200, text: "宋國有個農夫，每天在田裡辛苦耕作。" },
    { id: "s2", dur: 5200, text: "有一天，一隻兔子飛奔而來，一頭撞上樹樁，倒地不起。" },
    { id: "s3", dur: 5000, text: "農夫不費半點力氣就撿到兔子，樂得心花怒放。" },
    { id: "s4", dur: 8600, text: "從此他丟下鋤頭，天天守著樹樁等兔子。日子一天天過去，田荒了，兔子卻再也沒有出現。" },
    { id: "s5", dur: 7000, text: "守株待兔，比喻拘泥守成，妄想不勞而獲。" }
  ];
  var idx = -1, timer = null, voiceOn = true, zhVoice = null;
  var sub = document.getElementById("subtitle");

  function pickVoice() {
    var vs = speechSynthesis.getVoices();
    zhVoice = vs.find(function(v){return /zh[-_]TW/i.test(v.lang);}) ||
              vs.find(function(v){return /^zh/i.test(v.lang);}) || null;
  }
  if ("speechSynthesis" in window) {
    pickVoice();
    speechSynthesis.onvoiceschanged = pickVoice;
  }

  function speak(t) {
    if (!voiceOn || !("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(t);
    if (zhVoice) u.voice = zhVoice;
    u.lang = "zh-TW"; u.rate = 0.95;
    speechSynthesis.speak(u);
  }

  function showScene(i) {
    idx = i;
    scenes.forEach(function (s, j) {
      var el = document.getElementById(s.id);
      el.classList.remove("active");
      if (j === i) { void el.getBoundingClientRect(); el.classList.add("active"); }
    });
    sub.textContent = scenes[i].text;
    speak(scenes[i].text);
    clearTimeout(timer);
    if (i < scenes.length - 1) timer = setTimeout(function(){ showScene(i+1); }, scenes[i].dur);
  }

  function restart() {
    clearTimeout(timer);
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    scenes.forEach(function (s) { document.getElementById(s.id).classList.remove("active"); });
    setTimeout(function(){ showScene(0); }, 60);
  }

  document.getElementById("bigplay").addEventListener("click", function () {
    this.style.display = "none";
    if ("speechSynthesis" in window) { var u = new SpeechSynthesisUtterance(""); speechSynthesis.speak(u); }
    restart();
  });
  document.getElementById("replayBtn").addEventListener("click", restart);
  document.getElementById("voiceBtn").addEventListener("click", function () {
    voiceOn = !voiceOn;
    this.textContent = voiceOn ? "🔊 語音：開" : "🔇 語音：關";
    if (!voiceOn && "speechSynthesis" in window) speechSynthesis.cancel();
    else if (voiceOn && idx >= 0) speak(scenes[idx].text);
  });
})();
</script>
</body>
</html>

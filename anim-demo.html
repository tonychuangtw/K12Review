<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成語動畫卡試播 — 守株待兔</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#233047; font-family:"Microsoft JhengHei","PingFang TC",sans-serif; color:#fff;
         display:flex; flex-direction:column; align-items:center; min-height:100vh; padding:12px; }
  h1 { font-size:1.1rem; margin:8px 0 4px; color:#ffd97a; font-weight:600; }
  .hint { font-size:.8rem; color:#8fa3bf; margin-bottom:10px; }
  #stage-wrap { width:100%; max-width:720px; position:relative; border-radius:18px; overflow:hidden;
                box-shadow:0 8px 30px rgba(0,0,0,.45); background:#aee3f5; }
  svg { display:block; width:100%; height:auto; }
  #subtitle { position:absolute; left:0; right:0; bottom:0; padding:10px 16px 12px;
              background:linear-gradient(transparent, rgba(20,30,50,.78) 35%);
              font-size:clamp(.95rem,3.4vw,1.25rem); line-height:1.5; text-align:center;
              text-shadow:0 1px 3px #000; min-height:3.2em; display:flex; align-items:flex-end; justify-content:center; }
  #bigplay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
             background:rgba(15,24,40,.5); cursor:pointer; z-index:5; }
  #bigplay .btn { width:84px; height:84px; border-radius:50%; background:#ffd97a; display:flex; align-items:center;
                  justify-content:center; font-size:2.2rem; color:#4a3200; box-shadow:0 4px 18px rgba(0,0,0,.4);
                  animation:pulse 1.6s infinite; }
  #bigplay p { margin-top:14px; font-size:1rem; color:#ffe9b3; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  #controls { display:flex; gap:10px; margin-top:12px; }
  #controls button { border:none; border-radius:20px; padding:9px 20px; font-size:.95rem; cursor:pointer;
                     background:#31446a; color:#cfe0f5; }
  #controls button.primary { background:#ffd97a; color:#4a3200; font-weight:700; }

  .scene { opacity:0; pointer-events:none; transition:opacity .5s; }
  .scene.active { opacity:1; }

  /* 太陽光芒慢轉、雲飄 */
  .active .sunrays { animation:rot 14s linear infinite; transform-origin:660px 82px; }
  @keyframes rot { to{transform:rotate(360deg)} }
  .active .cloud1 { animation:drift 9s ease-in-out infinite alternate; }
  .active .cloud2 { animation:drift 12s ease-in-out infinite alternate-reverse; }
  @keyframes drift { from{transform:translateX(0)} to{transform:translateX(34px)} }

  /* S1 農夫耕作 */
  .active #farmer1 { animation:walkIn 2.2s ease-out forwards; }
  @keyframes walkIn { from{transform:translateX(-200px)} to{transform:translateX(0)} }
  .active #farmer1 .hoe { animation:hoeSwing 1.15s 2.3s ease-in-out infinite; transform-origin:56px 42px; }
  @keyframes hoeSwing { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-26deg)} }
  .active #farmer1 .headbob { animation:bob 1.15s 2.3s ease-in-out infinite; transform-origin:center bottom; }
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(3px)} }
  .wheat { transform-origin:bottom center; animation:sway 2.4s ease-in-out infinite; }
  @keyframes sway { 0%,100%{transform:rotate(-3deg)} 50%{transform:rotate(3deg)} }

  /* S2 兔子撞樁 */
  .active #rabbit2 { animation:dash 1.7s .5s cubic-bezier(.3,0,.7,1) forwards; }
  @keyframes dash { 0%{transform:translateX(340px)} 70%{transform:translateX(8px)} 78%{transform:translateX(-6px)} 100%{transform:translateX(0)} }
  .active #rabbit2 .earflap { animation:earflap .3s .5s linear 5; transform-origin:bottom center; }
  @keyframes earflap { 0%,100%{transform:rotate(0)} 50%{transform:rotate(14deg)} }
  .active #rabbit2 .body-g { animation:faint .8s 2.2s ease-in forwards; transform-origin:26px 52px; }
  @keyframes faint { 60%{transform:rotate(70deg) translateY(2px)} 100%{transform:rotate(84deg) translateY(6px)} }
  .active #rabbit2 .eye-open { animation:hideEye .1s 2.6s forwards; }
  .active #rabbit2 .eye-x { opacity:0; animation:showEye .1s 2.6s forwards; }
  @keyframes hideEye { to{opacity:0} }
  @keyframes showEye { to{opacity:1} }
  .active #bang { animation:bangPop .5s 2.1s ease-out forwards; transform-origin:center; opacity:0; }
  @keyframes bangPop { 0%{opacity:0; transform:scale(.2)} 60%{opacity:1; transform:scale(1.25)} 100%{opacity:1; transform:scale(1)} }
  .active .dizzy { animation:spin 1.3s 2.7s linear infinite; transform-origin:center; opacity:0; animation-fill-mode:forwards; }
  @keyframes spin { 0%{opacity:1; transform:rotate(0)} 100%{opacity:1; transform:rotate(360deg)} }

  /* S3 農夫撿兔 */
  .active #farmer3 { animation:runOver 1.4s ease-out forwards; }
  @keyframes runOver { from{transform:translateX(-220px)} to{transform:translateX(0)} }
  .active #farmer3 .jump { animation:joyJump .75s 1.6s ease-in-out 3; transform-origin:bottom center; }
  @keyframes joyJump { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-28px)} }
  .active .heart { animation:heartUp 1.4s 1.8s ease-out infinite; opacity:0; }
  @keyframes heartUp { 0%{opacity:0; transform:translateY(0) scale(.6)} 30%{opacity:1}
                       100%{opacity:0; transform:translateY(-46px) scale(1.15)} }
  .active .spark { animation:sparkle 1.1s 1.8s ease-in-out infinite; opacity:0; }
  @keyframes sparkle { 0%,100%{opacity:0; transform:scale(.5)} 50%{opacity:1; transform:scale(1.2)} }

  /* S4 呆等日夜 */
  .active #sunmoon { animation:cycle 3.6s .6s linear 2 forwards; transform-origin:400px 480px; }
  @keyframes cycle { from{transform:rotate(0)} to{transform:rotate(360deg)} }
  .active #sky4rect { animation:daynight 3.6s .6s linear 2 forwards; }
  @keyframes daynight { 0%,18%{fill:#aee3f5} 38%,70%{fill:#27355c} 90%,100%{fill:#aee3f5} }
  .active .star4 { animation:daynightStar 3.6s .6s linear 2 forwards; opacity:0; }
  @keyframes daynightStar { 0%,20%{opacity:0} 42%,66%{opacity:1} 88%,100%{opacity:0} }
  .active .weed { transform-origin:bottom center; animation:grow 2.6s 2.6s ease-out forwards; transform:scaleY(0); }
  @keyframes grow { to{transform:scaleY(1)} }
  .active #farmer4 .slump { animation:slump 3s 3.2s ease-in-out forwards; transform-origin:center bottom; }
  @keyframes slump { to{transform:rotate(8deg) translateY(4px)} }
  .active #farmer4 .eyelid { opacity:0; animation:showEye .4s 4.6s forwards; }
  .active #zzz { animation:zfloat 1.9s 4.8s ease-in-out infinite; opacity:0; }
  @keyframes zfloat { 0%{opacity:0; transform:translateY(0)} 40%{opacity:1} 100%{opacity:0; transform:translateY(-24px)} }

  /* S5 結尾字卡 */
  .active .zi { opacity:0; animation:ziPop .55s ease-out forwards; transform-origin:center; }
  .active .zi:nth-of-type(1){animation-delay:.15s} .active .zi:nth-of-type(2){animation-delay:.5s}
  .active .zi:nth-of-type(3){animation-delay:.85s} .active .zi:nth-of-type(4){animation-delay:1.2s}
  @keyframes ziPop { 0%{opacity:0; transform:scale(2.4) rotate(-8deg)} 70%{opacity:1; transform:scale(.94)}
                     100%{opacity:1; transform:scale(1)} }
  .active #meaning5 { opacity:0; animation:fadeUp .8s 1.9s ease-out forwards; }
  @keyframes fadeUp { from{opacity:0; transform:translateY(16px)} to{opacity:1; transform:translateY(0)} }
  .active #peek5 { animation:peekUp 1s 2.4s ease-out forwards; transform:translateY(90px); }
  @keyframes peekUp { to{transform:translateY(0)} }
  .active #peek5 .earwig { animation:earwig 1.6s 3.6s ease-in-out infinite; transform-origin:bottom center; }
  @keyframes earwig { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-8deg)} }
</style>
</head>
<body>
<h1>🎬 成語動畫卡（試播）— 守株待兔</h1>
<div class="hint">分鏡動畫＋語音朗讀・語音唸完才換下一幕・全程式繪製約 20KB</div>

<div id="stage-wrap">
  <svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <!-- Q版太陽 -->
      <g id="cutesun">
        <g class="sunrays">
          <g stroke="#ffcf4d" stroke-width="7" stroke-linecap="round">
            <line x1="660" y1="20" x2="660" y2="36"/><line x1="660" y1="128" x2="660" y2="144"/>
            <line x1="598" y1="82" x2="614" y2="82"/><line x1="706" y1="82" x2="722" y2="82"/>
            <line x1="617" y1="39" x2="628" y2="50"/><line x1="692" y1="114" x2="703" y2="125"/>
            <line x1="703" y1="39" x2="692" y2="50"/><line x1="628" y1="114" x2="617" y2="125"/>
          </g>
        </g>
        <circle cx="660" cy="82" r="34" fill="#ffdd66" stroke="#f5b73e" stroke-width="3"/>
        <circle cx="649" cy="77" r="3.4" fill="#7a4b12"/><circle cx="671" cy="77" r="3.4" fill="#7a4b12"/>
        <path d="M651 90 Q660 97 669 90" stroke="#7a4b12" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="642" cy="86" rx="5" ry="3.4" fill="#ffb0a0" opacity=".8"/>
        <ellipse cx="678" cy="86" rx="5" ry="3.4" fill="#ffb0a0" opacity=".8"/>
      </g>
      <!-- 背景：丘陵草地花朵 -->
      <g id="meadow">
        <ellipse cx="160" cy="360" rx="330" ry="120" fill="#b8e08e"/>
        <ellipse cx="640" cy="380" rx="360" ry="130" fill="#a5d47c"/>
        <rect y="360" width="800" height="90" fill="#95c96e"/>
        <g fill="#ff9eb5"><circle cx="90" cy="392" r="6"/><circle cx="98" cy="384" r="6"/><circle cx="82" cy="384" r="6"/><circle cx="90" cy="377" r="6"/><circle cx="90" cy="385" r="4" fill="#ffe066"/></g>
        <g fill="#a5c8ff"><circle cx="710" cy="402" r="5"/><circle cx="717" cy="395" r="5"/><circle cx="703" cy="395" r="5"/><circle cx="710" cy="389" r="5"/><circle cx="710" cy="396" r="3.4" fill="#fff"/></g>
        <g fill="#ffd166"><circle cx="560" cy="416" r="5"/><circle cx="567" cy="409" r="5"/><circle cx="553" cy="409" r="5"/><circle cx="560" cy="403" r="5"/><circle cx="560" cy="410" r="3.2" fill="#fff"/></g>
      </g>
      <!-- Q版樹樁（帶年輪笑臉感） -->
      <g id="stump">
        <path d="M-34 0 Q-38 44 -30 48 L30 48 Q38 44 34 0 Z" fill="#a8734a"/>
        <path d="M-34 0 Q-38 44 -30 48 L-14 48 Q-20 40 -18 0 Z" fill="#8f5d38" opacity=".6"/>
        <ellipse cx="0" cy="0" rx="36" ry="14" fill="#d8a878"/>
        <ellipse cx="0" cy="0" rx="24" ry="9" fill="none" stroke="#b9885a" stroke-width="2.5"/>
        <ellipse cx="0" cy="0" rx="12" ry="4.5" fill="none" stroke="#b9885a" stroke-width="2.5"/>
        <circle cx="0" cy="0" r="2.5" fill="#b9885a"/>
        <path d="M-30 14 q-8 2 -9 9" stroke="#8f5d38" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>
      <!-- Q版農夫（大頭短身） -->
      <g id="chibifarmer">
        <!-- 身體 -->
        <rect x="-22" y="18" width="44" height="42" rx="18" fill="#7fa8e0" stroke="#5c82ba" stroke-width="2.5"/>
        <rect x="-8" y="34" width="16" height="12" rx="4" fill="#a9c6ee"/>
        <!-- 腳 -->
        <rect x="-18" y="56" width="15" height="16" rx="7" fill="#4a5b7d"/>
        <rect x="3" y="56" width="15" height="16" rx="7" fill="#4a5b7d"/>
        <!-- 頭 -->
        <circle cx="0" cy="-8" r="27" fill="#ffe3c1" stroke="#eec39a" stroke-width="2"/>
        <!-- 斗笠 -->
        <path d="M-36 -18 Q0 -60 36 -18 Z" fill="#f0c05a" stroke="#d9a441" stroke-width="2.5"/>
        <ellipse cx="0" cy="-18" rx="38" ry="8" fill="#e2ae43" stroke="#d9a441" stroke-width="2"/>
        <!-- 大眼睛＋腮紅＋笑 -->
        <circle cx="-9" cy="-6" r="4.6" fill="#3a2e26"/><circle cx="-7.5" cy="-7.5" r="1.7" fill="#fff"/>
        <circle cx="9" cy="-6" r="4.6" fill="#3a2e26"/><circle cx="10.5" cy="-7.5" r="1.7" fill="#fff"/>
        <ellipse cx="-16" cy="2" rx="5.5" ry="3.6" fill="#ffb3a3"/>
        <ellipse cx="16" cy="2" rx="5.5" ry="3.6" fill="#ffb3a3"/>
        <path d="M-6 5 Q0 10 6 5" stroke="#3a2e26" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </g>
      <!-- Q版兔子 -->
      <g id="chibirabbit">
        <ellipse cx="26" cy="40" rx="28" ry="21" fill="#fff" stroke="#e3dcd4" stroke-width="2"/>
        <circle cx="58" cy="46" r="9" fill="#fff" stroke="#e3dcd4" stroke-width="2"/>
        <circle cx="-2" cy="24" r="19" fill="#fff" stroke="#e3dcd4" stroke-width="2"/>
        <g class="earflap">
          <ellipse cx="-12" cy="-4" rx="7.5" ry="19" fill="#fff" stroke="#e3dcd4" stroke-width="2" transform="rotate(-16 -12 -4)"/>
          <ellipse cx="-12" cy="-2" rx="4" ry="13" fill="#ffc4d0" transform="rotate(-16 -12 -2)"/>
        </g>
        <ellipse cx="4" cy="-6" rx="7.5" ry="19" fill="#fff" stroke="#e3dcd4" stroke-width="2" transform="rotate(10 4 -6)"/>
        <ellipse cx="4" cy="-4" rx="4" ry="13" fill="#ffc4d0" transform="rotate(10 4 -4)"/>
        <g class="eye-open"><circle cx="-9" cy="22" r="4" fill="#3a2e26"/><circle cx="-7.8" cy="20.8" r="1.5" fill="#fff"/></g>
        <g class="eye-x" stroke="#3a2e26" stroke-width="2.2" stroke-linecap="round"><line x1="-12" y1="19" x2="-6" y2="25"/><line x1="-6" y1="19" x2="-12" y2="25"/></g>
        <ellipse cx="-15" cy="30" rx="4.5" ry="3" fill="#ffb3a3"/>
        <path d="M-19 25 q-3 2 -2 5" stroke="#e8899a" stroke-width="2" fill="none" stroke-linecap="round"/>
        <path d="M-4 30 q3 3 7 1" stroke="#c9bfb4" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
      <!-- 雲 -->
      <g id="cloud">
        <ellipse cx="0" cy="0" rx="34" ry="15" fill="#fff"/>
        <ellipse cx="-22" cy="6" rx="20" ry="11" fill="#fff"/>
        <ellipse cx="24" cy="6" rx="22" ry="12" fill="#fff"/>
      </g>
    </defs>

    <!-- ====== 場景 1：農夫耕作 ====== -->
    <g id="s1" class="scene">
      <rect width="800" height="450" fill="#aee3f5"/>
      <use href="#cutesun"/>
      <g class="cloud1"><use href="#cloud" x="150" y="70"/></g>
      <g class="cloud2"><use href="#cloud" x="420" y="110" opacity=".8"/></g>
      <use href="#meadow"/>
      <g>
        <g class="wheat" style="animation-delay:0s"><line x1="520" y1="356" x2="520" y2="308" stroke="#d9b04c" stroke-width="5" stroke-linecap="round"/><ellipse cx="520" cy="302" rx="10" ry="17" fill="#f0cd6b"/></g>
        <g class="wheat" style="animation-delay:.3s"><line x1="580" y1="360" x2="580" y2="310" stroke="#d9b04c" stroke-width="5" stroke-linecap="round"/><ellipse cx="580" cy="304" rx="10" ry="17" fill="#f0cd6b"/></g>
        <g class="wheat" style="animation-delay:.15s"><line x1="640" y1="356" x2="640" y2="306" stroke="#d9b04c" stroke-width="5" stroke-linecap="round"/><ellipse cx="640" cy="300" rx="10" ry="17" fill="#f0cd6b"/></g>
        <g class="wheat" style="animation-delay:.45s"><line x1="700" y1="362" x2="700" y2="312" stroke="#d9b04c" stroke-width="5" stroke-linecap="round"/><ellipse cx="700" cy="306" rx="10" ry="17" fill="#f0cd6b"/></g>
        <g class="wheat" style="animation-delay:.6s"><line x1="754" y1="358" x2="754" y2="308" stroke="#d9b04c" stroke-width="5" stroke-linecap="round"/><ellipse cx="754" cy="302" rx="10" ry="17" fill="#f0cd6b"/></g>
      </g>
      <use href="#stump" x="362" y="330"/>
      <g id="farmer1">
        <g transform="translate(170,300)">
          <g class="hoe">
            <line x1="24" y1="30" x2="86" y2="-18" stroke="#a8734a" stroke-width="7" stroke-linecap="round"/>
            <path d="M86 -18 q20 2 24 12 l-16 12 q-8 -8 -8 -24 z" fill="#8b93a3"/>
          </g>
          <g class="headbob"><use href="#chibifarmer"/></g>
        </g>
      </g>
    </g>

    <!-- ====== 場景 2：兔子撞樁 ====== -->
    <g id="s2" class="scene">
      <rect width="800" height="450" fill="#aee3f5"/>
      <use href="#cutesun"/>
      <g class="cloud1"><use href="#cloud" x="200" y="80"/></g>
      <use href="#meadow"/>
      <use href="#stump" x="362" y="330"/>
      <g opacity=".35" stroke="#7fb2d9" stroke-width="4" stroke-linecap="round">
        <line x1="520" y1="330" x2="580" y2="330"/><line x1="545" y1="350" x2="615" y2="350"/><line x1="530" y1="312" x2="586" y2="312"/>
      </g>
      <g id="rabbit2" transform="translate(340,0)">
        <g transform="translate(402,318)"><g class="body-g"><use href="#chibirabbit"/></g></g>
      </g>
      <g id="bang" transform="translate(362,262)">
        <path d="M0-36 L10-13 L34-22 L17 0 L36 15 L11 13 L7 38 L-7 15 L-32 22 L-15 0 L-34-17 L-11-11 Z" fill="#ff8a5c" stroke="#f26d3d" stroke-width="3" stroke-linejoin="round"/>
        <text x="0" y="9" text-anchor="middle" font-size="26" font-weight="bold" fill="#fff">碰!</text>
      </g>
      <g class="dizzy" transform="translate(410,280)">
        <path d="M-10 0 a10 10 0 1 1 10 10" fill="none" stroke="#ffd94d" stroke-width="3.5" stroke-linecap="round"/>
        <circle cx="14" cy="-9" r="4" fill="#ffd94d"/><circle cx="-13" cy="10" r="3" fill="#ffd94d"/>
      </g>
    </g>

    <!-- ====== 場景 3：撿到兔子 ====== -->
    <g id="s3" class="scene">
      <rect width="800" height="450" fill="#aee3f5"/>
      <use href="#cutesun"/>
      <g class="cloud2"><use href="#cloud" x="480" y="90"/></g>
      <use href="#meadow"/>
      <use href="#stump" x="520" y="330"/>
      <g id="farmer3">
        <g transform="translate(300,300)">
          <g class="jump">
            <use href="#chibifarmer"/>
            <!-- 高舉的手臂 -->
            <line x1="-20" y1="24" x2="-40" y2="-8" stroke="#ffe3c1" stroke-width="10" stroke-linecap="round"/>
            <line x1="20" y1="24" x2="44" y2="-14" stroke="#ffe3c1" stroke-width="10" stroke-linecap="round"/>
            <!-- 手上兔子 -->
            <g transform="translate(58,-40) rotate(14) scale(.62)"><use href="#chibirabbit"/></g>
          </g>
        </g>
      </g>
      <g class="heart" style="animation-delay:1.8s" transform="translate(268,236)">
        <path d="M0 6 C-8 -6 -22 2 -12 14 L0 24 L12 14 C22 2 8 -6 0 6 Z" fill="#ff7b9c"/></g>
      <g class="heart" style="animation-delay:2.5s" transform="translate(392,214)">
        <path d="M0 4 C-6 -5 -17 1 -9 11 L0 18 L9 11 C17 1 6 -5 0 4 Z" fill="#ff9eb5"/></g>
      <g class="spark" style="animation-delay:2s" transform="translate(230,180)"><path d="M0-10 L3-3 L10 0 L3 3 L0 10 L-3 3 L-10 0 L-3-3 Z" fill="#fff27a"/></g>
      <g class="spark" style="animation-delay:2.3s" transform="translate(430,160)"><path d="M0-8 L2.5-2.5 L8 0 L2.5 2.5 L0 8 L-2.5 2.5 L-8 0 L-2.5-2.5 Z" fill="#fff27a"/></g>
    </g>

    <!-- ====== 場景 4：日夜呆等 ====== -->
    <g id="s4" class="scene">
      <rect id="sky4rect" width="800" height="450" fill="#aee3f5"/>
      <g class="star4" fill="#fff"><circle cx="120" cy="70" r="3"/><circle cx="260" cy="46" r="2.4"/><circle cx="560" cy="60" r="3"/><circle cx="700" cy="100" r="2.4"/><circle cx="420" cy="40" r="2"/></g>
      <g id="sunmoon">
        <g transform="translate(400,90)">
          <circle r="30" fill="#ffdd66" stroke="#f5b73e" stroke-width="3"/>
          <circle cx="-10" cy="-4" r="3" fill="#7a4b12"/><circle cx="10" cy="-4" r="3" fill="#7a4b12"/>
          <path d="M-8 6 Q0 12 8 6" stroke="#7a4b12" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        </g>
        <g transform="translate(400,870)">
          <path d="M14 -26 A30 30 0 1 0 26 16 A24 24 0 1 1 14 -26 Z" fill="#f4f1de" stroke="#d8d4bd" stroke-width="2"/>
          <circle cx="-2" cy="-2" r="2.6" fill="#8d886c"/>
          <path d="M-8 8 Q-4 11 0 8" stroke="#8d886c" stroke-width="2" fill="none" stroke-linecap="round"/>
        </g>
      </g>
      <use href="#meadow"/>
      <use href="#stump" x="362" y="330"/>
      <g class="weed" style="animation-delay:2.6s"><path d="M560 372 q-6 -34 -18 -44 M560 372 q2 -38 14 -50 M560 372 q10 -26 24 -30" stroke="#5f8a46" stroke-width="5" fill="none" stroke-linecap="round"/></g>

<div id="controls">
  <button class="primary" id="replayBtn">🔁 重播</button>
  <button id="voiceBtn">🔊 語音：開</button>
</div>

<script>
(function () {
  var scenes = [
    { id: "s1", minDur: 5200, text: "宋國有個農夫，每天在田裡辛苦耕作。" },
    { id: "s2", minDur: 5400, text: "有一天，一隻兔子飛奔而來，一頭撞上樹樁，倒地不起。" },
    { id: "s3", minDur: 5200, text: "農夫不費半點力氣就撿到兔子，樂得心花怒放。" },
    { id: "s4", minDur: 9000, text: "從此他丟下鋤頭，天天守著樹樁等兔子。日子一天天過去，田荒了，兔子卻再也沒有出現。" },
    { id: "s5", minDur: 7000, text: "守株待兔，比喻拘泥守成，妄想不勞而獲。" }
  ];
  var TTS = ("speechSynthesis" in window);
  var idx = -1, gen = 0, voiceOn = true, zhVoice = null;
  var sub = document.getElementById("subtitle");

  function pickVoice() {
    var vs = speechSynthesis.getVoices();
    zhVoice = vs.find(function(v){return /zh[-_]TW/i.test(v.lang);}) ||
              vs.find(function(v){return /^zh/i.test(v.lang);}) || null;
  }
  if (TTS) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

  /* 換幕條件：最短秒數到了 && 語音唸完（雙條件都滿足才走）
     語音關閉或裝置不支援 → 只看秒數；保險絲：語音逾時 15 秒視同唸完 */
  function showScene(i) {
    idx = i; gen++;
    var myGen = gen;
    scenes.forEach(function (s, j) {
      var el = document.getElementById(s.id);
      el.classList.remove("active");
      if (j === i) { void el.getBoundingClientRect(); el.classList.add("active"); }
    });
    sub.textContent = scenes[i].text;

    var timeDone = false, speechDone = !(voiceOn && TTS);
    function tryNext() {
      if (gen !== myGen) return;
      if (timeDone && speechDone && i < scenes.length - 1) showScene(i + 1);
    }
    setTimeout(function(){ timeDone = true; tryNext(); }, scenes[i].minDur);

    if (voiceOn && TTS) {
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(scenes[i].text);
      if (zhVoice) u.voice = zhVoice;
      u.lang = "zh-TW"; u.rate = 0.95;
      var done = function(){ if (speechDone) return; speechDone = true; setTimeout(tryNext, 800); };
      u.onend = done; u.onerror = done;
      setTimeout(done, scenes[i].minDur + 15000); /* 保險絲 */
      speechSynthesis.speak(u);
    }
  }

  function restart() {
    gen++;
    if (TTS) speechSynthesis.cancel();
    scenes.forEach(function (s) { document.getElementById(s.id).classList.remove("active"); });
    setTimeout(function(){ showScene(0); }, 60);
  }

  document.getElementById("bigplay").addEventListener("click", function () {
    this.style.display = "none";
    if (TTS) { var u = new SpeechSynthesisUtterance(""); speechSynthesis.speak(u); }
    restart();
  });
  document.getElementById("replayBtn").addEventListener("click", restart);
  document.getElementById("voiceBtn").addEventListener("click", function () {
    voiceOn = !voiceOn;
    this.textContent = voiceOn ? "🔊 語音：開" : "🔇 語音：關";
    if (TTS) speechSynthesis.cancel();
    if (idx >= 0) { var cur = idx; showScene(cur); } /* 以新設定重播本幕 */
  });
})();
</script>

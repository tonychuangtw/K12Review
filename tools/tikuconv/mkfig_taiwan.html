<!-- 臺灣位置與周邊島嶼圖：底圖由 gen-image.sh --gpt（ChatGPT 網頁的 gpt-image）產生，
     中文標籤用這支 HTML 疊上去再截圖（模型寫的中文會缺筆畫，所以底圖一律要求「不要文字」）。
     產圖：node tools/svg-preview.mjs tools/tikuconv/mkfig_taiwan.html <out.png> 900 900
           cwebp -q 88 <out.png> -o img/social/taiwan-location.webp

     ⚠ 社會科的地圖，島嶼位置錯了會教錯（Tony 2026-08-19 抓到馬祖擺到內陸）。
     標籤座標一律用經緯度換算，不要目測：
       校正點（在底圖上量出來的）：富貴角 121.53E,25.30N → (462,350)
                                   鵝鑾鼻 120.85E,21.90N → (408,595)
       換算：x = 462 + (lon - 121.53) * 72
             y = 350 + (25.30 - lat) * 72          （每度約 72px，用澎湖交叉驗證過）
     量校正點的方法：把底圖套上 50px 紅色格線截圖（見 git 歷史的 _grid.html）再讀座標。 -->
<style>
  html,body{margin:0;padding:0}
  .wrap{position:relative;width:900px;height:900px;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
  .wrap img{display:block;width:900px;height:900px}
  .l{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
     text-shadow:0 0 5px #fff,0 0 5px #fff,0 0 5px #fff,0 0 5px #fff}
  .land{font-weight:800;font-size:27px;color:#4f6b2a}
  .tw{font-weight:900;font-size:32px;color:#a1441a}
  .sea{font-weight:700;font-size:25px;color:#12587f}
  .isle{font-weight:700;font-size:17px;color:#5d4a1c}
  .dot{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;
       background:#f0a92e;border:2px solid #a1441a;box-sizing:border-box}
</style>
<div class="wrap">
  <img src="/img/social/_base-taiwan-gpt.webp" alt="">
  <div class="l tw"   style="left:419px;top:468px">臺灣</div>
  <div class="l land" style="left:117px;top:315px">中國</div>
  <div class="l land" style="left:477px;top:81px">南韓（韓國）</div>
  <div class="l land" style="left:711px;top:180px">日本</div>
  <div class="l land" style="left:450px;top:765px">菲律賓</div>
  <div class="l sea"  style="left:520px;top:270px">東海</div>
  <div class="l sea"  style="left:780px;top:558px">太平洋</div>
  <div class="l sea"  style="left:352px;top:420px">臺灣海峽</div>
  <div class="l sea"  style="left:450px;top:645px">巴士海峽</div>
  <div class="l sea"  style="left:180px;top:702px">南海</div>
  <!-- 島嶼位置＝用實際經緯度換算（見檔頭校正公式），不是目測擺的 -->
  <div class="dot" style="left:347px;top:289px"></div><div class="l isle" style="left:311px;top:289px">馬祖</div>
  <div class="dot" style="left:231px;top:413px"></div><div class="l isle" style="left:198px;top:413px">金門</div>

  <div class="dot" style="left:491px;top:383px"></div><div class="l isle" style="left:530px;top:381px">龜山島</div>
  <div class="dot" style="left:459px;top:540px"></div><div class="l isle" style="left:496px;top:538px">綠島</div>
  <div class="dot" style="left:462px;top:585px"></div><div class="l isle" style="left:499px;top:587px">蘭嶼</div>

</div>

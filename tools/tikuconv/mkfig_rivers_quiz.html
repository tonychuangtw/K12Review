<!doctype html><meta charset="utf-8">
<!-- 臺灣主要河川分布圖：底圖由 gen-image.sh --gpt 產生（要求「不要文字」，模型寫的中文會缺筆畫），
     中文標籤用這支 HTML 疊上去再截圖。
     產圖：node tools/svg-preview.mjs tools/tikuconv/mkfig_rivers.html <out.png> 1024 1536
           cwebp -q 86 <out.png> -o img/social/taiwan-rivers-quiz.webp

     ⚠ 標籤位置一律用經緯度換算，不准目測（Tony 2026-08-19 定案）。
     校正點（用 50/100px 格線量出來，見 tools/tikuconv/_grid_rivers.html）：
       富貴角 121.53E,25.30N → (665,33)      鵝鑾鼻 120.85E,21.90N → (380,1445)
     換算：x = 665 + (lon - 121.53) * 419
           y =  33 + (25.30 - lat) * 415
     注意：底圖是插畫不是投影圖，離島（澎湖、綠島）畫得比實際近，本圖只標本島河川；
           換算出的點若落在海裡，再沿同一緯度往島上「貼到畫出來的那條河的出海口」（可目視驗證的地物），
           不是憑感覺挪位置。 -->
<style>

  .w{position:relative;width:1024px;height:1536px;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}

  .l{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-weight:800;font-size:26px;
     color:#0b4f75;text-shadow:0 0 6px #fff,0 0 6px #fff,0 0 6px #fff,0 0 6px #fff}
  .num{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;line-height:36px;
       border-radius:50%;background:#fff;border:3px solid #c2410c;color:#c2410c;
       font-weight:900;font-size:22px;text-align:center;box-sizing:border-box}
  .t{position:absolute;left:50%;transform:translateX(-50%);top:24px;font-size:34px;font-weight:900;
     color:#1f3d5c;text-shadow:0 0 8px #fff,0 0 8px #fff,0 0 8px #fff}
</style>
<div class="w">
  <img src="/img/social/_base-rivers-gpt.webp" alt="">

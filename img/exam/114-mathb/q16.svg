  <circle cx="335" cy="205" r="3.6" fill="#111"/>
  <g font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="18" fill="#111">
    <text x="168" y="278">A</text>
    <text x="486" y="278">B</text>
    <text x="330" y="90">C</text>
    <text x="344" y="222">O</text>

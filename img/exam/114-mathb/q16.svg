<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 320" width="560" height="320" role="img" aria-label="牆角 O 與貼合在牆面地面上的三角形擋板 ABC">
  <rect width="560" height="320" fill="#ffffff"/>
  <g fill="none" stroke="#111" stroke-width="2" stroke-linecap="round">
    <!-- 三條兩兩垂直的交界線（牆角） -->
    <line x1="335" y1="205" x2="120" y2="292"/>
    <line x1="335" y1="205" x2="550" y2="292"/>
    <line x1="335" y1="205" x2="335" y2="40"/>

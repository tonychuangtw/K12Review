    <polygon points="60,250 360,250 331,196 89,196" fill="#e8e8e8"/>
    <polygon points="89,196 331,196 302,142 118,142" fill="#dcdcdc"/>
    <polygon points="118,142 302,142 273,88 147,88" fill="#d0d0d0"/>
    <polygon points="147,88 273,88 210,40" fill="#c4c4c4"/>
  </g>
  <g font-size="13" text-anchor="middle" fill="#111">

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" font-family="'Noto Sans TC',sans-serif">
  <rect width="420" height="300" fill="#fff"/>
  <!-- pyramid layers: base y=250, apex y=40, half-width 150 at base -->
  <!-- layer boundaries at heights: 0m y=250, 900m y=196, 1800m y=142, 3600m y=88, apex y=40 -->

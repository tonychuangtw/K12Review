<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 330" width="460" height="330" font-family="sans-serif">
  <rect width="460" height="330" fill="#fff"/>
  <!-- 繪圖區 -->
  <rect x="80" y="20" width="330" height="240" fill="none" stroke="#888" stroke-width="1"/>
  <!-- 格線與 y 軸刻度：0.6 頂 -0.2 底，共 0.8 → 240px，每 0.2 = 60px -->
  <g stroke="#ddd" stroke-width="1">
    <line x1="80" y1="80" x2="410" y2="80"/>
    <line x1="80" y1="140" x2="410" y2="140"/>
    <line x1="80" y1="200" x2="410" y2="200"/>
  </g>
  <g font-size="11" fill="#333" text-anchor="end">
    <text x="74" y="24">0.6</text>
    <text x="74" y="84">0.4</text>
    <text x="74" y="144">0.2</text>
    <text x="74" y="204">0</text>
    <text x="74" y="264">-0.2</text>
  </g>
  <!-- x 軸刻度：-0.6 左 0.4 右，共 1.0 → 330px，每 0.2 = 66px -->
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="80" y="278">-0.6</text>
    <text x="146" y="278">-0.4</text>
    <text x="212" y="278">-0.2</text>
    <text x="278" y="278">0</text>
    <text x="344" y="278">0.2</text>
    <text x="410" y="278">0.4</text>
  </g>
  <!-- 0 線（社會增加率 0 與 自然增加率 0） -->
  <line x1="278" y1="20" x2="278" y2="260" stroke="#999" stroke-width="1"/>
  <line x1="80" y1="200" x2="410" y2="200" stroke="#999" stroke-width="1"/>
  <!-- 資料點：x = 278 + 社會增加率*330, y = 200 - 自然增加率*300 -->
  <!-- 甲 (-0.45, -0.03) -->
  <circle cx="129" cy="209" r="4" fill="#111"/><text x="129" y="228" font-size="13" text-anchor="middle">甲</text>
  <!-- 乙 (-0.13, 0.33) -->
  <circle cx="235" cy="101" r="4" fill="#111"/><text x="248" y="106" font-size="13">乙</text>
  <!-- 丙 (-0.10, 0.18) -->
  <circle cx="245" cy="146" r="4" fill="#111"/><text x="258" y="151" font-size="13">丙</text>
  <!-- 丁 (0.25, 0.39) -->
  <circle cx="361" cy="83" r="4" fill="#111"/><text x="374" y="88" font-size="13">丁</text>
  <!-- 軸名 -->
  <text x="245" y="302" font-size="13" text-anchor="middle">社會增加率（％）</text>
  <text x="26" y="140" font-size="13" text-anchor="middle" transform="rotate(-90 26 140)">自然增加率（％）</text>
  <text x="245" y="322" font-size="13" text-anchor="middle" fill="#555">圖二</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340" font-family="sans-serif">
  <rect width="520" height="340" fill="#fff"/>
  <!-- 座標軸：y 0~110 對應 y=260~30（每 10% = 20.9px），x 六個年齡組 -->
  <line x1="70" y1="270" x2="480" y2="270" stroke="#333" stroke-width="1.5"/>
  <line x1="70" y1="20" x2="70" y2="270" stroke="#333" stroke-width="1.5"/>
  <g font-size="11" fill="#333" text-anchor="end">
    <text x="64" y="55">100</text><text x="64" y="76">90</text><text x="64" y="97">80</text>
    <text x="64" y="118">70</text><text x="64" y="139">60</text><text x="64" y="160">50</text>
    <text x="64" y="181">40</text><text x="64" y="202">30</text><text x="64" y="223">20</text>
    <text x="64" y="244">10</text><text x="64" y="274">0</text>
  </g>
  <g font-size="11" fill="#333" text-anchor="middle">
    <text x="105" y="288">15-24</text><text x="175" y="288">25-29</text><text x="245" y="288">30-39</text>
    <text x="315" y="288">40-49</text><text x="385" y="288">50-64</text><text x="455" y="288">65以上</text>
  </g>
  <text x="70" y="14" font-size="12">百分比</text>
  <text x="500" y="288" font-size="12" text-anchor="end">年齡</text>
  <!-- 男性：47 98 102 101 67 21 → y = 270 - 值*2.09 -->
  <polyline points="105,172 175,65 245,57 315,59 385,130 455,226" fill="none" stroke="#111" stroke-width="2"/>
  <g fill="none" stroke="#111" stroke-width="1.5">
    <path d="M105,166 l6,10 h-12 z"/><path d="M175,59 l6,10 h-12 z"/><path d="M245,51 l6,10 h-12 z"/>
    <path d="M315,53 l6,10 h-12 z"/><path d="M385,124 l6,10 h-12 z"/><path d="M455,220 l6,10 h-12 z"/>
  </g>
  <!-- 女性：44 53 49 68 38 11 -->
  <polyline points="105,178 175,159 245,168 315,128 385,191 455,247" fill="none" stroke="#111" stroke-width="1.6" stroke-dasharray="8 4 2 4"/>
  <g fill="#fff" stroke="#111" stroke-width="1.5">
    <rect x="100" y="173" width="10" height="10"/><rect x="170" y="154" width="10" height="10"/>
    <rect x="240" y="163" width="10" height="10"/><rect x="310" y="123" width="10" height="10"/>
    <rect x="380" y="186" width="10" height="10"/><rect x="450" y="242" width="10" height="10"/>
  </g>
  <!-- 圖例 -->
  <line x1="150" y1="312" x2="196" y2="312" stroke="#111" stroke-width="1.6" stroke-dasharray="8 4 2 4"/>
  <rect x="168" y="307" width="10" height="10" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="204" y="317" font-size="12">女性</text>
  <line x1="270" y1="312" x2="316" y2="312" stroke="#111" stroke-width="2"/>
  <path d="M293,306 l6,10 h-12 z" fill="none" stroke="#111" stroke-width="1.5"/>
  <text x="324" y="317" font-size="12">男性</text>
  <text x="430" y="317" font-size="12" fill="#555">圖八</text>
</svg>

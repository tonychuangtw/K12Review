<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 340" width="420" height="340" font-family="serif">
  <rect width="420" height="340" fill="#fff"/>
  <!-- 座標軸 -->
  <line x1="30" y1="200" x2="400" y2="200" stroke="#222" stroke-width="1.6"/>
  <polygon points="400,200 392,196 392,204" fill="#222"/>
  <line x1="210" y1="325" x2="210" y2="20" stroke="#222" stroke-width="1.6"/>
  <polygon points="210,20 206,28 214,28" fill="#222"/>
  <text x="404" y="215" font-size="15" font-style="italic">x</text>
  <text x="216" y="24" font-size="15" font-style="italic">y</text>

  <!-- y = x （斜率 1，從第三象限到第一象限） -->
  <line x1="90" y1="320" x2="330" y2="80" stroke="#555" stroke-width="1.2" stroke-dasharray="0"/>
  <text x="300" y="103" font-size="14" font-style="italic">y=x</text>

  <!-- L1：斜率約 -2.2（往左上），較不陡 -->
  <line x1="140" y1="46" x2="280" y2="354" stroke="#0057b8" stroke-width="1.8"/>
  <text x="120" y="52" font-size="14" font-style="italic">L</text><text x="130" y="57" font-size="10">1</text>

  <!-- L2：斜率約 -4.4（往左上），更陡、更靠近 y 軸 -->
  <line x1="175" y1="46" x2="245" y2="354" stroke="#0057b8" stroke-width="1.8"/>
  <text x="176" y="42" font-size="14" font-style="italic">L</text><text x="186" y="47" font-size="10">2</text>

  <!-- L3：斜率約 0.45（過原點，在 y=x 下方） -->
  <line x1="30" y1="281" x2="400" y2="114.5" stroke="#c0392b" stroke-width="1.8"/>
  <text x="352" y="128" font-size="14" font-style="italic">L</text><text x="362" y="133" font-size="10">3</text>

  <!-- L4：與 L3 平行，往下平移（c &lt; 0） -->
  <line x1="30" y1="331" x2="400" y2="164.5" stroke="#c0392b" stroke-width="1.8"/>
  <text x="352" y="178" font-size="14" font-style="italic">L</text><text x="362" y="183" font-size="10">4</text>
</svg>

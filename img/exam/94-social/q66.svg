<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 250" width="660" height="250" font-family="'Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="660" height="250" fill="#fff"/>
  <!-- 圖10 溫度 -->
  <g transform="translate(10,10)">
    <text x="150" y="14" text-anchor="middle" font-size="14" font-weight="bold">圖10　氣溫</text>
    <text x="34" y="34" font-size="11">°C</text>
    <line x1="46" y1="26" x2="46" y2="186" stroke="#222" stroke-width="1.8"/>
    <line x1="46" y1="186" x2="292" y2="186" stroke="#222" stroke-width="1.8"/>
    <g font-size="11" text-anchor="end" fill="#333">
      <text x="42" y="190">0</text><text x="42" y="164">5</text><text x="42" y="138">10</text>
      <text x="42" y="112">15</text><text x="42" y="86">20</text><text x="42" y="60">25</text>
    </g>
    <g stroke="#222" stroke-width="1">
      <line x1="42" y1="186" x2="46" y2="186"/><line x1="42" y1="160" x2="46" y2="160"/>
      <line x1="42" y1="134" x2="46" y2="134"/><line x1="42" y1="108" x2="46" y2="108"/>
      <line x1="42" y1="82" x2="46" y2="82"/><line x1="42" y1="56" x2="46" y2="56"/>
    </g>
    <!-- 1 unit = 5.2px, y0=186 ; x: month m -> 56 + (m-1)*20 -->
    <polyline fill="none" stroke="#111" stroke-width="2.2"
      points="56,56 76,63.8 96,82 116,105.4 136,128.8 156,144.4 176,147 196,141.8 216,128.8 236,105.4 256,87.2 276,66.4"/>
    <g fill="#111">
      <circle cx="56" cy="56" r="3.5"/><circle cx="76" cy="63.8" r="3.5"/><circle cx="96" cy="82" r="3.5"/>
      <circle cx="116" cy="105.4" r="3.5"/><circle cx="136" cy="128.8" r="3.5"/><circle cx="156" cy="144.4" r="3.5"/>
      <circle cx="176" cy="147" r="3.5"/><circle cx="196" cy="141.8" r="3.5"/><circle cx="216" cy="128.8" r="3.5"/>
      <circle cx="236" cy="105.4" r="3.5"/><circle cx="256" cy="87.2" r="3.5"/><circle cx="276" cy="66.4" r="3.5"/>
    </g>
    <g font-size="10" text-anchor="middle" fill="#333">
      <text x="56" y="200">1</text><text x="76" y="200">2</text><text x="96" y="200">3</text><text x="116" y="200">4</text>
      <text x="136" y="200">5</text><text x="156" y="200">6</text><text x="176" y="200">7</text><text x="196" y="200">8</text>
      <text x="216" y="200">9</text><text x="236" y="200">10</text><text x="256" y="200">11</text><text x="276" y="200">12</text>
    </g>
    <text x="296" y="200" font-size="10">月份</text>
  </g>
  <!-- 圖11 雨量 -->
  <g transform="translate(340,10)">
    <text x="150" y="14" text-anchor="middle" font-size="14" font-weight="bold">圖11　降水量</text>
    <text x="30" y="34" font-size="11">mm</text>
    <line x1="52" y1="26" x2="52" y2="186" stroke="#222" stroke-width="1.8"/>
    <line x1="52" y1="186" x2="292" y2="186" stroke="#222" stroke-width="1.8"/>
    <g font-size="11" text-anchor="end" fill="#333">
      <text x="48" y="178">30</text><text x="48" y="154">35</text><text x="48" y="130">40</text>
      <text x="48" y="106">45</text><text x="48" y="82">50</text><text x="48" y="58">55</text>
    </g>
    <!-- baseline value 25 at y=198 ; 1mm = 4.8px -->
    <g fill="#fff" stroke="#111" stroke-width="1.4">
      <rect x="58"  y="150"   width="17" height="36"/>
      <rect x="77"  y="92.4"  width="17" height="93.6"/>
      <rect x="96"  y="92.4"  width="17" height="93.6"/>
      <rect x="115" y="87.6"  width="17" height="98.4"/>
      <rect x="134" y="92.4"  width="17" height="93.6"/>
      <rect x="153" y="39.6"  width="17" height="146.4"/>
      <rect x="172" y="73.2"  width="17" height="112.8"/>
      <rect x="191" y="54"    width="17" height="132"/>
      <rect x="210" y="104.4" width="17" height="81.6"/>
      <rect x="229" y="82.8"  width="17" height="103.2"/>
      <rect x="248" y="132"   width="17" height="54"/>
      <rect x="267" y="115.2" width="17" height="70.8"/>
    </g>
    <g font-size="10" text-anchor="middle" fill="#333">
      <text x="66" y="200">1</text><text x="85" y="200">2</text><text x="104" y="200">3</text><text x="123" y="200">4</text>
      <text x="142" y="200">5</text><text x="161" y="200">6</text><text x="180" y="200">7</text><text x="199" y="200">8</text>
      <text x="218" y="200">9</text><text x="237" y="200">10</text><text x="256" y="200">11</text><text x="275" y="200">12</text>
    </g>
    <text x="296" y="200" font-size="10">月份</text>
  </g>
  <text x="330" y="234" text-anchor="middle" font-size="11" fill="#666">圖11 縱軸自 25 mm 起繪</text>
</svg>

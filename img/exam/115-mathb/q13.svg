<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 240" width="420" height="240" role="img" aria-label="兩直線與 x 軸交角示意圖">
  <rect width="420" height="240" fill="#ffffff"/>
  <g fill="none" stroke="#111" stroke-width="2">
    <!-- x 軸 -->
    <line x1="30" y1="190" x2="400" y2="190"/>
    <polygon points="400,190 388,185 388,195" fill="#111" stroke="none"/>
    <!-- L2：過 (-20,0)，斜角 30 度（向右上） -->
    <line x1="60" y1="190" x2="310" y2="46"/>
    <!-- L1：過原點 O，斜角 75 度（向左上） -->
    <line x1="290" y1="190" x2="310" y2="46"/>
  </g>
  <circle cx="310" cy="46" r="4" fill="#111"/>
  <g font-family="Georgia,'Times New Roman',serif" font-style="italic" font-size="17" fill="#111">
    <text x="196" y="72">L₂</text>
    <text x="316" y="92">L₁</text>
    <text x="284" y="212">O</text>
    <text x="394" y="212" font-style="normal">x</text>
  </g>
  <g font-family="'Noto Sans TC','PingFang TC',sans-serif" font-size="15" fill="#111">
    <text x="160" y="212">20</text>
  </g>
</svg>

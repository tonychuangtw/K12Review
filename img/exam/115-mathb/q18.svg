<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" width="420" height="300" role="img" aria-label="甲星以北極星 P 為圓心逆時針旋轉 90 度的圓弧軌跡">
  <rect width="420" height="300" fill="#ffffff"/>
  <g fill="none" stroke="#111" stroke-width="1.6">
    <line x1="60" y1="170" x2="390" y2="170"/><polygon points="394,170 382,166 382,174" fill="#111" stroke="none"/>
    <line x1="120" y1="285" x2="120" y2="40"/><polygon points="120,36 116,48 124,48" fill="#111" stroke="none"/>
  </g>
  <!-- 整個圓（虛線）：圓心 P(200,250)，半徑 80√2 ≈ 113.1 -->
  <circle cx="200" cy="250" r="113.1" fill="none" stroke="#111" stroke-width="1.3" stroke-dasharray="6 5"/>
  <!-- 甲星軌跡：由 (8,0) 逆時針 90 度到 (0,0)（螢幕上為往左的上凸弧） -->
  <path d="M280 170 A113.1 113.1 0 0 0 120 170" fill="none" stroke="#111" stroke-width="2.8"/>
  <g fill="#111">
    <circle cx="280" cy="170" r="4.5"/>
    <circle cx="120" cy="170" r="4.5"/>
    <circle cx="200" cy="250" r="4"/>
  </g>
  <g font-family="Georgia,'Times New Roman',serif" font-size="15" fill="#111">
    <text x="272" y="192">(8,0)</text>
    <text x="88" y="192">(0,0)</text>
    <text x="208" y="256" font-style="italic">P</text>
  </g>
</svg>

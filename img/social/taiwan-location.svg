<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" width="760" height="560" role="img" aria-labelledby="t d">
  <title id="t">臺灣的位置與周邊島嶼示意圖</title>
  <desc id="d">臺灣位在亞洲東部、太平洋西側；西隔臺灣海峽與中國相望，東北隔東海與日本、南韓相望，南隔巴士海峽與菲律賓相鄰。周邊島嶼有金門、馬祖、澎湖群島、龜山島、綠島、蘭嶼、琉球嶼。</desc>
  <style>
    .land { font: 700 21px "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #3f3320; }
    .sea  { font: 700 20px "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #1e5f8a; }
    .isle { font: 600 15px "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #4a3b22; }
    .tw   { font: 800 24px "Noto Sans TC", "Microsoft JhengHei", sans-serif; fill: #8a3b12; }
  </style>
  <rect width="760" height="560" fill="#dceaf5"/>

  <!-- 中國（西） -->
  <path d="M0,80 C110,110 175,165 190,245 C200,320 165,390 85,440 L0,470 Z" fill="#e8e0cc" stroke="#b3a785" stroke-width="2"/>
  <text class="land" x="40" y="270">中國</text>
  <!-- 南韓（北） -->
  <path d="M420,20 C455,25 470,55 462,90 C452,120 425,128 408,112 C392,92 396,40 420,20 Z" fill="#e8e0cc" stroke="#b3a785" stroke-width="2"/>
  <text class="land" x="404" y="78">南韓</text>
  <!-- 日本（東北） -->
  <path d="M596,40 C650,55 700,95 735,150 C748,172 736,196 714,188 C660,166 610,110 586,66 C578,48 584,36 596,40 Z" fill="#e8e0cc" stroke="#b3a785" stroke-width="2"/>
  <text class="land" x="640" y="120">日本</text>
  <!-- 菲律賓（南） -->
  <path d="M470,470 C510,462 545,486 552,520 C556,542 534,556 508,548 C480,538 458,504 470,470 Z" fill="#e8e0cc" stroke="#b3a785" stroke-width="2"/>
  <text class="land" x="476" y="520">菲律賓</text>

  <!-- 臺灣本島 -->
  <path d="M420,175 C448,205 464,262 458,320 C453,366 434,404 412,414 C392,402 378,364 378,316 C378,262 394,205 420,175 Z"
        fill="#f6d9a8" stroke="#c07a2a" stroke-width="3"/>
  <text class="tw" x="392" y="305">臺灣</text>

  <!-- 周邊島嶼 -->
  <g fill="#f6d9a8" stroke="#c07a2a" stroke-width="2">
    <circle cx="322" cy="330" r="8"/>          <!-- 澎湖 -->
    <circle cx="205" cy="298" r="6"/>          <!-- 金門 -->
    <circle cx="176" cy="212" r="6"/>          <!-- 馬祖 -->
    <circle cx="472" cy="212" r="6"/>          <!-- 龜山島 -->
    <circle cx="486" cy="352" r="6"/>          <!-- 綠島 -->
    <circle cx="498" cy="386" r="6"/>          <!-- 蘭嶼 -->
    <circle cx="352" cy="390" r="6"/>          <!-- 琉球嶼 -->
  </g>
  <g class="isle">
    <text x="270" y="352">澎湖群島</text>
    <text x="216" y="303">金門</text>
    <text x="188" y="208">馬祖</text>
    <text x="484" y="205">龜山島</text>
    <text x="498" y="350">綠島</text>
    <text x="510" y="392">蘭嶼</text>
    <text x="272" y="396">琉球嶼</text>
  </g>

  <!-- 海域 -->
  <text class="sea" x="520" y="150">東海</text>
  <text class="sea" x="596" y="320">太平洋</text>
  <text class="sea" x="236" y="245">臺灣海峽</text>
  <text class="sea" x="368" y="452">巴士海峽</text>
  <text class="sea" x="150" y="500">南海</text>

  <!-- 方位 -->
  <g transform="translate(700,470)">
    <circle r="34" fill="#ffffff" stroke="#7d93a8" stroke-width="2"/>
    <path d="M0,-24 L9,8 L0,1 L-9,8 Z" fill="#c0392b"/>
    <text x="0" y="-28" text-anchor="middle" style="font:700 15px 'Noto Sans TC',sans-serif;fill:#3b4657">北</text>
    <text x="0" y="30" text-anchor="middle" style="font:600 13px 'Noto Sans TC',sans-serif;fill:#7d93a8">南</text>
  </g>
</svg>

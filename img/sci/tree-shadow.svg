<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" font-family="'Noto Sans TC','PingFang TC',sans-serif">
  <rect width="720" height="260" fill="#ffffff"/>
  <g id="scene">
    <!-- three panels: same place, same time, different seasons -->
    <g transform="translate(20,0)">
      <line x1="0" y1="200" x2="200" y2="200" stroke="#8d6e4f" stroke-width="3"/>
      <rect x="92" y="120" width="10" height="80" fill="#8d6e4f"/>
      <circle cx="97" cy="108" r="34" fill="#4f9d69"/>
      <polygon points="102,203 174,203 168,191 102,191" fill="#5b6472" opacity=".6"/>
      <text x="100" y="232" font-size="20" text-anchor="middle" fill="#333">甲</text>
    </g>
    <g transform="translate(250,0)">
      <line x1="0" y1="200" x2="200" y2="200" stroke="#8d6e4f" stroke-width="3"/>
      <rect x="92" y="120" width="10" height="80" fill="#8d6e4f"/>
      <circle cx="97" cy="108" r="34" fill="#4f9d69"/>
      <polygon points="102,203 134,203 130,191 102,191" fill="#5b6472" opacity=".6"/>
      <text x="100" y="232" font-size="20" text-anchor="middle" fill="#333">乙</text>
    </g>
    <g transform="translate(480,0)">
      <line x1="0" y1="200" x2="210" y2="200" stroke="#8d6e4f" stroke-width="3"/>
      <rect x="72" y="120" width="10" height="80" fill="#8d6e4f"/>
      <circle cx="77" cy="108" r="34" fill="#4f9d69"/>
      <polygon points="82,203 206,203 198,191 82,191" fill="#5b6472" opacity=".6"/>
      <text x="100" y="232" font-size="20" text-anchor="middle" fill="#333">丙</text>
    </g>
  </g>
  <text x="360" y="26" font-size="18" text-anchor="middle" fill="#555">同一地點、同一時刻，不同季節的樹影</text>
</svg>
